[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roman-urdu-nlp"
version = "0.1.0"
description = "NLP toolkit for Roman Urdu (Urdish): normalization, tokenization, stopwords, sentiment and transliteration."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ZarkiDev", email = "zarkidev@gmail.com" }]
keywords = ["roman urdu", "urdu", "nlp", "urdish", "pakistani", "sentiment", "transliteration"]
requires-python = ">=3.8"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Urdu",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/zarkidev/roman-urdu-nlp"
Issues = "https://github.com/zarkidev/roman-urdu-nlp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
